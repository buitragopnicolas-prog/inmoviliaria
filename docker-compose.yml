services:
  sonar-db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    profiles: [sonar]
    networks: [sonar]
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar_local_only}
    volumes:
      - sonar_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 5s
      timeout: 5s
      retries: 20

  sonarqube:
    image: sonarqube:community@sha256:c0f1160bccfa435db4168c2d7df69af3c3ea7bfeb87395613014048fb33a68c1
    profiles: [sonar]
    networks: [sonar]
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar_local_only}
    ports:
      - "127.0.0.1:${SONAR_HOST_PORT:-9002}:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    depends_on:
      sonar-db:
        condition: service_healthy
    ulimits:
      nofile: { soft: 131072, hard: 131072 }
      nproc: 8192

  sonar-scanner:
    image: sonarsource/sonar-scanner-cli@sha256:a3f4215076706c95a17a68c19322ee916e40a3acd081a8c1a1e839e0194afa57
    profiles: [sonar-scan]
    networks: [sonar]
    working_dir: /usr/src
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN:-}
    volumes:
      - ./apps/api/src:/usr/src/apps/api/src:ro
      - ./apps/api/tsconfig.json:/usr/src/apps/api/tsconfig.json:ro
      - ./apps/web/app:/usr/src/apps/web/app:ro
      - ./apps/web/components:/usr/src/apps/web/components:ro
      - ./apps/web/lib:/usr/src/apps/web/lib:ro
      - ./apps/web/tsconfig.json:/usr/src/apps/web/tsconfig.json:ro
      - ./scripts:/usr/src/scripts:ro
      - ./coverage:/usr/src/coverage:ro
      - ./sonar-project.properties:/usr/src/sonar-project.properties:ro
      - ./package.json:/usr/src/package.json:ro
      - ./.git:/usr/src/.git:ro
      - ./.gitignore:/usr/src/.gitignore:ro
      - sonar_scanner_cache:/opt/sonar-scanner/.sonar
    command:
      - -Dsonar.projectKey=${SONAR_PROJECT_KEY:-inmobiliaria-raiz-platform}
      - -Dsonar.qualitygate.wait=true
      - -Dsonar.qualitygate.timeout=600

  postgres:
    image: postgres:17-alpine
    container_name: inmobiliaria_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inmobiliaria}
      POSTGRES_USER: ${POSTGRES_USER:-inmobiliaria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inmobiliaria_segura}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - inmobiliaria_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inmobiliaria} -d ${POSTGRES_DB:-inmobiliaria}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-app-init:
    image: postgres:17-alpine
    container_name: inmobiliaria_postgres_app_init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-inmobiliaria}
      PGUSER: ${POSTGRES_USER:-inmobiliaria}
      PGPASSWORD: ${POSTGRES_PASSWORD:-inmobiliaria_segura}
      APP_DATABASE_USER: ${POSTGRES_APP_USER:-inmobiliaria_app}
      APP_DATABASE_PASSWORD: ${POSTGRES_APP_PASSWORD:-local_app_password_change_me}
    volumes:
      - ./docker/postgres/configure-app-role.sql:/docker-entrypoint-initdb.d/configure-app-role.sql:ro
    restart: "no"
    command:
      - /bin/sh
      - -ec
      - |
        psql --set=ON_ERROR_STOP=1 \
          --set=database_name="$$PGDATABASE" \
          --set=migrator_user="$$PGUSER" \
          --set=app_user="$$APP_DATABASE_USER" \
          --set=app_password="$$APP_DATABASE_PASSWORD" \
          --file=/docker-entrypoint-initdb.d/configure-app-role.sql

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: inmobiliaria_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    container_name: inmobiliaria_minio_init
    depends_on:
      minio:
        condition: service_started
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD:-minioadmin}@minio:9000
      STORAGE_BUCKET: inmobiliaria-assets
      MINIO_APP_USER: ${MINIO_APP_USER:-inmobiliaria-app}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD:-local_app_password_change_me}
    volumes:
      - ./docker/minio/app-policy.json:/policies/app-policy.json:ro
    restart: "no"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mc ls local >/dev/null 2>&1; do
          echo "Esperando MinIO..."
          sleep 1
        done
        mc mb --ignore-existing local/$$STORAGE_BUCKET
        mc anonymous set none local/$$STORAGE_BUCKET
        mc admin user add local "$$MINIO_APP_USER" "$$MINIO_APP_PASSWORD"
        mc admin policy create local inmobiliaria-app-policy /policies/app-policy.json
        mc admin policy attach local inmobiliaria-app-policy --user "$$MINIO_APP_USER"
        printf '' | mc pipe local/$$STORAGE_BUCKET/files/generic/.keep
        printf '' | mc pipe local/$$STORAGE_BUCKET/files/property-360/.keep
        printf '' | mc pipe local/$$STORAGE_BUCKET/property-images/.keep

  clamav:
    image: clamav/clamav@sha256:a5f03c12a79dbe9f6d8a527b6bb1ea053fa8dd061d3738a26897f055ee2d9303
    container_name: inmobiliaria_clamav
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    volumes:
      - clamav_signatures:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.50"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: inmobiliaria_api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_APP_USER:-inmobiliaria_app}:${POSTGRES_APP_PASSWORD:-local_app_password_change_me}@postgres:5432/${POSTGRES_DB:-inmobiliaria}?schema=public
      DATABASE_MIGRATION_URL: postgresql://${POSTGRES_USER:-inmobiliaria}:${POSTGRES_PASSWORD:-inmobiliaria_segura}@postgres:5432/${POSTGRES_DB:-inmobiliaria}?schema=public
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
      PORT: 4000
      STORAGE_ENDPOINT: minio
      STORAGE_PORT: 9000
      STORAGE_USE_SSL: false
      STORAGE_BUCKET: inmobiliaria-assets
      STORAGE_ACCESS_KEY: ${MINIO_APP_USER:-inmobiliaria-app}
      STORAGE_SECRET_KEY: ${MINIO_APP_PASSWORD:-local_app_password_change_me}
      STORAGE_AUTO_CREATE_BUCKET: false
      ANTIMALWARE_ENABLED: true
      ANTIMALWARE_HOST: clamav
      ANTIMALWARE_PORT: 3310
      ANTIMALWARE_TIMEOUT_MS: ${ANTIMALWARE_TIMEOUT_MS:-15000}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    ports:
      - "${API_HOST_PORT:-4000}:4000"
    volumes:
      - uploads:/app/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy
      postgres-app-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    command: sh -ec "mkdir -p apps/api/uploads/seed && cp -rn seed-assets/. apps/api/uploads/seed/ && DATABASE_URL=\"$$DATABASE_MIGRATION_URL\" npm run db:migrate -w @inmobiliaria/api && DATABASE_URL=\"$$DATABASE_MIGRATION_URL\" npm run db:seed -w @inmobiliaria/api && npm run start:prod -w @inmobiliaria/api"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    container_name: inmobiliaria_web
    env_file: .env
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      - api

networks:
  sonar:

volumes:
  sonar_db:
  sonar_data:
  sonar_extensions:
  sonar_logs:
  sonar_scanner_cache:
  inmobiliaria_db:
  uploads:
  minio_data:
  clamav_signatures:
