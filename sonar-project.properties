sonar.projectName=Asesoria Inmobiliaria JB
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12
sonar.sources=apps/api/src,apps/web/app,apps/web/components,apps/web/lib,scripts
sonar.tests=apps/api/src,apps/web/lib,scripts
sonar.test.inclusions=**/*.test.ts,**/*.test.mjs
sonar.exclusions=**/*.test.ts,**/*.test.mjs,apps/api/src/generated/**,scripts/e2e-*.mjs,scripts/test-web-errors.mjs
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600
