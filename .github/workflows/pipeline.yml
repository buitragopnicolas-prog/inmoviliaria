name: Validate and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: Entorno para desplegar después de validar
        required: true
        type: choice
        options: [dev, prod]
      sha:
        description: SHA completo en main
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://inmobiliaria:ci_password@localhost:5432/inmobiliaria_ci?schema=public
      JWT_SECRET: ci-only-secret-not-for-deployment-1234567890
      ADMIN_INITIAL_PASSWORD: CI-admin-123456
      CUSTOMER_INITIAL_PASSWORD: CI-customer-123456
      NEXT_TELEMETRY_DISABLED: '1'
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: inmobiliaria
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: inmobiliaria_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inmobiliaria -d inmobiliaria_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate manual release
        if: github.event_name == 'workflow_dispatch'
        env:
          DEPLOY_SHA: ${{ inputs.sha }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$DEPLOY_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$DEPLOY_SHA" ]]
          git merge-base --is-ancestor "$DEPLOY_SHA" origin/main
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm run test:coverage
      - name: Test deployment smoke checks with Python coverage
        run: |
          python3 -m venv /tmp/inmo-python-ci
          /tmp/inmo-python-ci/bin/pip install coverage==7.10.7
          /tmp/inmo-python-ci/bin/coverage run --branch --include='scripts/smoke-dev-vps.py,scripts/backup-production.py' -m unittest discover -s scripts -p 'test_*.py'
          /tmp/inmo-python-ci/bin/coverage xml -o coverage/python.xml
      - run: npm run test:web-errors
      - run: npm audit --audit-level=high
      - run: npm run db:migrate
      - run: npm run db:seed
      - name: Restore-check production backup against disposable CI database
        env:
          BACKUP_CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          python3 scripts/backup-production.py ci "$(git rev-parse HEAD)"
          bash -n scripts/production-release.sh scripts/vps-ssh-entry.sh
      - name: Start disposable MinIO and real ClamAV for E2E
        run: |
          docker run -d --name inmo-ci-minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            bitnamilegacy/minio@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
          docker run -d --name inmo-ci-clamav -p 127.0.0.1:3310:3310 \
            --health-cmd '/usr/local/bin/clamdcheck.sh' \
            --health-interval 5s --health-timeout 5s --health-retries 100 \
            --memory 1536m \
            clamav/clamav@sha256:a5f03c12a79dbe9f6d8a527b6bb1ea053fa8dd061d3738a26897f055ee2d9303
          for attempt in $(seq 1 120); do
            if [[ "$(docker inspect --format '{{.State.Health.Status}}' inmo-ci-clamav)" == healthy ]]; then break; fi
            sleep 5
          done
          [[ "$(docker inspect --format '{{.State.Health.Status}}' inmo-ci-clamav)" == healthy ]]
      - name: Mandatory full manual payment E2E and API smoke
        env:
          APP_ENV: development
          NODE_ENV: production
          PUBLIC_REGISTRATION_ENABLED: 'false'
          PAYMENT_MODE: manual
          PAYMENT_GATEWAY: none
          MANUAL_PAYMENT_BANK_NAME: Banco sintético CI
          MANUAL_PAYMENT_ACCOUNT_HOLDER: Titular de pruebas CI
          MANUAL_PAYMENT_ACCOUNT_TYPE: Ahorros
          MANUAL_PAYMENT_ACCOUNT_DISPLAY: '0000000000'
          MANUAL_PAYMENT_BREB_KEY_TYPE: Alfanumérica de prueba
          MANUAL_PAYMENT_BREB_KEY_DISPLAY: '@ci-no-pagar'
          MANUAL_PAYMENT_QR_IMAGE_URL: /ci-qr.svg
          STORAGE_ENDPOINT: 127.0.0.1
          STORAGE_PORT: '9000'
          STORAGE_USE_SSL: 'false'
          STORAGE_ACCESS_KEY: minioadmin
          STORAGE_SECRET_KEY: minioadmin
          STORAGE_BUCKET: inmobiliaria-ci
          STORAGE_AUTO_CREATE_BUCKET: 'false'
          ANTIMALWARE_ENABLED: 'true'
          ANTIMALWARE_HOST: 127.0.0.1
          ANTIMALWARE_PORT: '3310'
          WEB_ORIGIN: http://127.0.0.1:3000
          API_INTERNAL_URL: http://127.0.0.1:4000
          E2E_BASE_URL: http://127.0.0.1:4000/api
          E2E_WEB_URL: http://127.0.0.1:3000
          E2E_ADMIN_EMAIL: admin@asesoriainmobiliariajb.com
          E2E_ADMIN_PASSWORD: CI-admin-123456
          E2E_CUSTOMER_EMAIL: cliente@asesoriainmobiliariajb.com
          E2E_CUSTOMER_PASSWORD: CI-customer-123456
        run: |
          node --input-type=module <<'NODE'
          import { Client } from 'minio';
          import { setTimeout as delay } from 'node:timers/promises';
          const storage = new Client({endPoint:'127.0.0.1',port:9000,useSSL:false,accessKey:'minioadmin',secretKey:'minioadmin'});
          let ready = false;
          for (let attempt=0; attempt<60; attempt++) {
            try {
              if (!await storage.bucketExists('inmobiliaria-ci')) await storage.makeBucket('inmobiliaria-ci','us-east-1');
              ready = true; break;
            } catch { await delay(1000); }
          }
          if (!ready) throw new Error('MinIO CI no está disponible.');
          NODE
          cp scripts/fixtures/manual-payment-qr.svg apps/web/public/ci-qr.svg
          cp -r apps/web/public apps/web/.next/standalone/apps/web/public
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          node apps/api/dist/main.js > /tmp/inmo-api.log 2>&1 &
          api_pid=$!
          PORT=3000 HOSTNAME=127.0.0.1 node apps/web/.next/standalone/apps/web/server.js > /tmp/inmo-web.log 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true; rm -f apps/web/public/ci-qr.svg; cat /tmp/inmo-api.log /tmp/inmo-web.log' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4000/api/health/ready && curl -fsS -o /dev/null http://127.0.0.1:3000/login; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:4000/api/health/ready
          curl -fsS http://127.0.0.1:4000/api/properties
          curl -fsS -o /dev/null http://127.0.0.1:3000/login
          npm run test:e2e:ci
          npm run test:e2e:production:ci
          # Each probe logs in three synthetic actors. Respect the real five/minute login limit.
          sleep 61
          # A deliberate failure must still void its payment and disable the temporary accounts.
          if npm run test:e2e:production:ci -- --ci-fail-after-report; then
            echo 'El fallo controlado no bloqueó la prueba.' >&2
            exit 1
          fi
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('coverage/production-payment-cleanup-e2e.json', 'utf8'));
          assert.equal(report.error, 'Fallo controlado CI después del reporte.');
          assert.equal(report.passed, false);
          for (const key of ['cleanup', 'existingRecordsUnchanged', 'temporarySessionsRevoked']) assert.equal(report[key], true);
          NODE
          cleanup_run="$(node -p "JSON.parse(require('node:fs').readFileSync('coverage/production-payment-cleanup-e2e.json')).run")"
          npm run test:e2e:production:ci -- --cleanup "$cleanup_run"
          bash -n scripts/e2e-production-vps.sh scripts/vps-ssh-entry.sh
      - name: Save manual payment E2E evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: manual-payments-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage/manual-payments-e2e.json
            coverage/production-payment-*-e2e.json
            coverage/production-payment-e2e.json
          if-no-files-found: warn
          retention-days: 7
      - name: Clean up disposable E2E services
        if: always()
        run: docker rm -f inmo-ci-minio inmo-ci-clamav || true
      - name: Validate manifests
        run: |
          kubectl kustomize k8s/infra/dev > /tmp/inmo-infra-dev.yaml
          kubectl kustomize k8s/overlays/dev > /tmp/inmo-dev.yaml
          kubectl kustomize k8s/overlays/prod > /tmp/inmo-prod.yaml
      - name: Build deployable images
        run: |
          docker build -f apps/api/Dockerfile -t asesoria-inmobiliaria-api:ci .
          docker build -f apps/web/Dockerfile --build-arg NEXT_PUBLIC_API_URL=https://dev.asesoriainmobiliariajb.com -t asesoria-inmobiliaria-web:ci .
      - name: Production security gate
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'prod'
        run: npm audit --audit-level=high

      - name: Require Sonar configuration
        if: github.event_name != 'pull_request'
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: node scripts/sonar-gate.mjs --check-config
      - name: Sonar analysis and mandatory quality gate
        if: github.event_name != 'pull_request'
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.scm.revision=${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.sha }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
      - name: Verify Sonar approval for the release commit
        if: github.event_name != 'pull_request'
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          DEPLOY_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.sha }}
        run: node scripts/sonar-gate.mjs "$DEPLOY_SHA"

  deploy-dev:
    needs: validate
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'dev')
    runs-on: ubuntu-24.04
    environment:
      name: development
      url: https://dev.asesoriainmobiliariajb.com
    concurrency:
      group: inmobiliaria-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.sha }}
          persist-credentials: false
      - name: SSH deploy dev
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DEPLOY_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.sha }}
        run: |
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_SSH_KEY"
          [[ "$DEPLOY_SHA" =~ ^[a-f0-9]{40}$ ]]
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cp .github/known_hosts ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/inmo-deploy-key
          ssh -i ~/.ssh/inmo-deploy-key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "$DEPLOY_SHA"

  deploy-prod:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'prod'
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://asesoriainmobiliariajb.com
    concurrency:
      group: inmobiliaria-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: SSH verified backup, reviewed SHA deployment and mandatory production E2E
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DEPLOY_SHA: ${{ inputs.sha }}
        run: |
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_SSH_KEY"
          [[ "$DEPLOY_SHA" =~ ^[a-f0-9]{40}$ ]]
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cp .github/known_hosts ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/inmo-deploy-key
          ssh -i ~/.ssh/inmo-deploy-key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "$DEPLOY_SHA production-backup-e2e"
